<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neumorphic Starter</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #root { max-width: 1126px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
</style>
<link rel="stylesheet" href="App.css">
</head>
<body>
<div id="root">
  <section id="center">
    <div class="hero">
      <svg class="base" viewBox="0 0 170 180" aria-hidden="true"><path d="M85 8 158 50v80L85 172 12 130V50z" fill="#c9c2ff" opacity=".55"/><path d="M85 8 158 50 85 92 12 50z" fill="#ddd8ff"/></svg>
      <svg class="framework" viewBox="-11.5 -10.2 23 20.5" aria-hidden="true"><circle r="2.05" fill="#61dafb"/><g stroke="#61dafb" fill="none"><ellipse rx="11" ry="4.2"/><ellipse rx="11" ry="4.2" transform="rotate(60)"/><ellipse rx="11" ry="4.2" transform="rotate(120)"/></g></svg>
      <svg class="vite" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3l10 18L22 3l-10 2z" fill="#a78bfa"/><path d="M13 2 8 3l-1 9 3-1-1 6 5-9-3 1z" fill="#ffcc4d"/></svg>
    </div>
    <div>
      <h1>Get started</h1>
      <p>Edit <code>src/App.jsx</code> and save to test <code>HMR</code></p>
    </div>
    <button class="counter" onclick="this.lastChild.textContent=+this.lastChild.textContent+1">Count is <span>0</span></button>
  </section>
  <div class="ticks"></div>
  <section id="next-steps">
    <div id="docs">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/></svg>
      <h2>Documentation</h2>
      <p>Your questions, answered</p>
      <ul>
        <li><a href="#">Explore Vite</a></li>
        <li><a href="#">Learn more</a></li>
      </ul>
    </div>
    <div id="social">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M17 11a4 4 0 0 0 0-8M22 21a7 7 0 0 0-4-6.3"/></svg>
      <h2>Connect with us</h2>
      <p>Join the Vite community</p>
      <ul>
        <li><a href="#">GitHub</a></li>
        <li><a href="#">Discord</a></li>
        <li><a href="#">X.com</a></li>
        <li><a href="#">Bluesky</a></li>
      </ul>
    </div>
  </section>
  <div class="ticks"></div>
  <section id="spacer"></section>
</div>
</body>
</html>
